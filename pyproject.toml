[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allforone"
version = "0.1.0"
description = "Client-agnostic WhatsApp-to-helpdesk support hub with human-approved replies, an LLM judge and self-learning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.optional-dependencies]
groq = ["groq>=0.9"]
telegram = []          # the Bot API adapter only needs httpx (already a core dependency)
vertex = ["google-genai>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/allforone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP037", "UP035", "B904", "E501"]
