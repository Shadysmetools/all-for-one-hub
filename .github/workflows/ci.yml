name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: python -m pytest -q
      - name: PII scan
        run: python scripts/pii_scan.py
      - name: Demo smoke test
        run: python -m allforone.demo --no-color --out "$RUNNER_TEMP/demo"

  desktop:
    # The Tauri crate's unit tests (no network, no keys). The toolchain is pinned in rust-toolchain.toml.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Cargo test
        run: cargo test --locked

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scan the full history with the gitleaks CLI. The action's commit-range mode fails on a
      # root commit ("<root>^" doesn't exist), so a first push or a fresh history would break.
      # Scan only the history reachable from the checked-out commit, so a test value on another
      # open branch can't turn every PR red.
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --redact -v --exit-code 1 --log-opts="HEAD" .
